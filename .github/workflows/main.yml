name: AnyDesk Remote Desktop

on:
  workflow_dispatch:

jobs:
  anydesk:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Windows
        shell: powershell
        run: |
          Write-Host "Configurando Windows Runner..."
          Write-Host "Sistema: Windows"
          Write-Host "Preparando ambiente..."

      - name: Download AnyDesk
        shell: powershell
        run: |
          $url = "https://download.anydesk.com/AnyDesk.exe"
          $installer = "$env:TEMP\AnyDesk.exe"

          Invoke-WebRequest -Uri $url -OutFile $installer

          if (!(Test-Path $installer)) {
              throw "Falha ao baixar AnyDesk."
          }

          Write-Host "Download concluído!"

      - name: Verify AnyDesk
        shell: powershell
        run: |
          $installer = "$env:TEMP\AnyDesk.exe"

          $signature = Get-AuthenticodeSignature $installer

          if ($signature.Status -ne "Valid") {
              throw "Assinatura inválida."
          }

          Write-Host "AnyDesk verificado!"

      - name: Install AnyDesk
        shell: powershell
        run: |
          $installer = "$env:TEMP\AnyDesk.exe"

          Start-Process -FilePath $installer `
            -ArgumentList "--install `"$env:ProgramFiles\AnyDesk`" --silent" `
            -Wait

          Write-Host "Instalação solicitada."

      - name: Check Installation
        shell: powershell
        run: |
          $anydesk = "$env:ProgramFiles\AnyDesk\AnyDesk.exe"

          if (Test-Path $anydesk) {
              Write-Host "AnyDesk encontrado!"
          }
          else {
              Write-Host "Instalação não confirmada."
          }

      - name: Finish
        shell: powershell
        run: |
          Write-Host "=============================="
          Write-Host "     ANYDESK WORKFLOW"
          Write-Host "=============================="
          Write-Host "Configuração finalizada."
          Write-Host "O runner é temporário."
          Write-Host "=============================="
